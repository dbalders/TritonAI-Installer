name: Installer release

on:
  workflow_dispatch:
    inputs:
      installer_version:
        description: Stable version matching package.json on main
        required: true
        default: '0.3.4'
        type: string
      harness_version:
        description: Published stable Harness version
        required: true
        default: '0.3.4'
        type: string
      harness_run_id:
        description: Successful Harness release.yml run that produced the published assets
        required: true
        type: string
      harness_commit:
        description: Exact 40-character Harness tag commit
        required: true
        type: string
      skills_commit:
        description: Reviewed 40-character secure-skills commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: installer-stable-release
  cancel-in-progress: false

env:
  INSTALLER_VERSION: ${{ inputs.installer_version }}
  HARNESS_VERSION: ${{ inputs.harness_version }}
  HARNESS_RUN_ID: ${{ inputs.harness_run_id }}
  HARNESS_COMMIT: ${{ inputs.harness_commit }}
  SKILLS_COMMIT: ${{ inputs.skills_commit }}

jobs:
  preflight:
    if: github.repository == 'dbalders/TritonAI-Installer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Inspect existing drafts before starting expensive builds.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
      - name: Verify source and published Harness prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/validate-windows-signing-inputs.cjs
          node scripts/installer-release-preflight.cjs

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-15
            artifact: desktop-mac-arm64
            environment: macos-signing
          - platform: win
            runner: windows-latest
            artifact: desktop-win-x64
            environment: windows-signing
    runs-on: ${{ matrix.runner }}
    environment: ${{ matrix.environment }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      TRITONAI_HARNESS_VERSION: ${{ inputs.harness_version }}
      TRITONAI_HARNESS_RELEASE_BASE: https://github.com/dbalders/TritonAI-Harness/releases/download/v${{ inputs.harness_version }}
      TRITONAI_HARNESS_RUN_ARTIFACT_DIR: ${{ github.workspace }}/.release-input/harness-run
      UCSD_SKILLS_SOURCE: ${{ github.workspace }}/.release-input/secure-skills
      UCSD_AI_BASE_URL: ${{ secrets.UCSD_AI_BASE_URL }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_USE_AZURE_CLI: 'true'
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Mint read-only Harness artifact token
        id: harness_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_INPUT_APP_ID }}
          private-key: ${{ secrets.RELEASE_INPUT_APP_PRIVATE_KEY }}
          owner: dbalders
          repositories: TritonAI-Harness
          permission-actions: read
      - name: Mint read-only secure-skills token
        id: skills_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_INPUT_APP_ID }}
          private-key: ${{ secrets.RELEASE_INPUT_APP_PRIVATE_KEY }}
          owner: dbalders
          repositories: UCSD-Skills-Library-Secure
          permission-contents: read
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: dbalders/TritonAI-Harness
          run-id: ${{ inputs.harness_run_id }}
          name: ${{ matrix.artifact }}
          path: .release-input/harness-run
          github-token: ${{ steps.harness_token.outputs.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dbalders/UCSD-Skills-Library-Secure
          ref: ${{ inputs.skills_commit }}
          path: .release-input/secure-skills
          token: ${{ steps.skills_token.outputs.token }}
          persist-credentials: false
      - run: npm ci
      - run: npm test
      - run: npm run test:clean-runtime
      - name: Sign in to Azure with OIDC
        if: matrix.platform == 'win'
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Package signed Windows executables and verify native boot
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          npm run package:win-installer:signed
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows packaging failed.' }
          foreach ($proof in @('authenticode-signatures.json', 'packaged-boot.json')) {
            if (!(Test-Path -LiteralPath "artifacts/windows-installer/$proof" -PathType Leaf)) {
              throw "Signed Windows packaging did not produce $proof."
            }
          }
      - name: Import Mac signing identity
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 24)"
          umask 077
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/release.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/release.p12"
      - name: Package signed and notarized Mac DMG and verify native boot
        if: matrix.platform == 'mac'
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY")
          npm run package:mac-release
      - name: Remove Mac signing inputs
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/release.p12"
      # Explicit file lists avoid publishing the private secure-skills checkout.
      - name: Retain Mac candidate and verification inputs
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-mac
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/macos-release/*.dmg
            artifacts/macos-release/packaged-boot.json
            vendor/t3code-desktop/mac-arm64/
      - name: Retain Windows candidate and verification inputs
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-win
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/windows-installer/*.exe
            artifacts/windows-installer/*.blockmap
            artifacts/windows-installer/*.yml
            artifacts/windows-installer/*.json
            artifacts/windows-installer/win-unpacked/TritonAI Installer.exe
            vendor/t3code-desktop/win-x64/

  draft:
    needs: build
    runs-on: windows-latest # Release contract rechecks Authenticode natively.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: installer-*
          merge-multiple: true
      - run: npm ci
      - name: Recheck prerequisites and create verified draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/validate-windows-signing-inputs.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Harness prerequisite verification failed.' }
          node scripts/installer-release-preflight.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installer prerequisite verification failed.' }
          git rev-parse --verify "refs/tags/v$env:INSTALLER_VERSION" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git tag "v$env:INSTALLER_VERSION" $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Local release tag creation failed.' }
          }
          npm run release:github -- "v$env:INSTALLER_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Verified draft creation failed.' }
