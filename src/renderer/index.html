<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TritonAI Installer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="single-screen panel active" id="credentials-panel" aria-labelledby="credentials-title">
        <div class="setup-card">
          <div class="panel-header">
            <h2 id="credentials-title">Let's get you set up.</h2>
            <p id="credentials-copy">Add your TritonAI access key. We’ll check which models it can use and configure the right routing automatically.</p>
          </div>

          <form id="credentials-form" class="form">
            <div class="credential-field">
              <label class="field-label" for="api-key">TritonAI access key</label>
              <div class="input-wrap">
                <input id="api-key" name="api-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="api-key-help" />
                <button type="button" class="visibility-toggle" id="api-key-visibility-toggle" aria-label="Show TritonAI access key" aria-pressed="false" title="Show access key">
                  <span class="eye-icon" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <div class="credential-field secondary-key-group" id="secondary-key-group" hidden>
              <label class="field-label" for="api-key-secondary">Additional access key</label>
              <div class="input-wrap">
                <input id="api-key-secondary" name="api-key-secondary" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="api-key-help" />
                <button type="button" class="visibility-toggle" id="api-key-secondary-visibility-toggle" aria-label="Show additional TritonAI access key" aria-pressed="false" title="Show additional access key">
                  <span class="eye-icon" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <p class="field-help credential-note" id="api-key-help" aria-live="polite">Most people only need one key.</p>
            <div class="credential-mode-actions">
              <button type="button" class="multiple-key-toggle" id="multiple-key-toggle" aria-expanded="false" aria-controls="secondary-key-group">I have another access key</button>
            </div>

            <div class="actions">
              <button type="submit" class="primary" id="continue-button" disabled>Check access &amp; install</button>
              <button type="button" class="link-button" id="open-docs-footer">Don't have a key?</button>
            </div>
          </form>

          <section class="inline-progress" id="inline-progress" aria-label="Install progress" aria-live="polite" hidden>
            <div class="connection-meter">
              <div class="progress-track" aria-label="Install progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-bar"></span></div>
              <strong id="progress-value">0%</strong>
            </div>
          </section>
          <div class="result" id="result"></div>
          <pre id="log" aria-hidden="true"></pre>
        </div>
      </section>
    </main>

    <script src="./install-progress.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
